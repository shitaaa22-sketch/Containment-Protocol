name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub's ubuntu-latest image already provides Java and the Android SDK.
      # Avoid setup actions that replace/reconfigure the runner's SDK installation.
      - name: Cache Godot 4.3 binary and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            Godot_v4.3-stable_linux.x86_64
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3-${{ runner.os }}-android-templates-v1

      - name: Verify preinstalled Java and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          : "${JAVA_HOME:?JAVA_HOME is not set on this runner}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          java -version
          "$SDKMANAGER" --version

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          # Keep pipefail disabled only for license acceptance: sdkmanager can
          # close the input early, which otherwise makes yes exit with SIGPIPE.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"
          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list_installed

      - name: Download Godot 4.3 and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="Godot_v4.3-stable_linux.x86_64.zip"
          TEMPLATE_TPZ="Godot_v4.3-stable_export_templates.tpz"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/$GODOT_ZIP" \
            --output "$GODOT_ZIP"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/$TEMPLATE_TPZ" \
            --output "$TEMPLATE_TPZ"

          unzip -o "$GODOT_ZIP" -d "$GITHUB_WORKSPACE"
          chmod +x ./Godot_v4.3-stable_linux.x86_64

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          TEMPLATE_EXTRACT="$RUNNER_TEMP/godot-export-templates"
          mkdir -p "$TEMPLATE_DIR" "$TEMPLATE_EXTRACT"
          unzip -o "$TEMPLATE_TPZ" -d "$TEMPLATE_EXTRACT"
          # The .tpz archive stores templates beneath a top-level templates/ folder.
          test -d "$TEMPLATE_EXTRACT/templates"
          cp -a "$TEMPLATE_EXTRACT/templates/." "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_source.zip"
          test -s "$TEMPLATE_DIR/android_debug.apk"

          ./Godot_v4.3-stable_linux.x86_64 --version
          echo "Godot Android templates:"
          ls -lh "$TEMPLATE_DIR"/android_*

      - name: Configure Godot Android settings and persistent release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $secret_name"
              exit 1
            fi
          done
          mkdir -p "$HOME/.config/godot"
          for settings_file in \
            "$HOME/.config/godot/editor_settings-4.tres" \
            "$HOME/.config/godot/editor_settings-4.3.tres"; do
            cat > "$settings_file" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
          test -s "$GITHUB_WORKSPACE/release.keystore"
          sed -i "s/^config\/version=.*/config\/version=\"$GITHUB_SHA\"/" project.godot
          sed -i "s/^version\/code=.*/version\/code=$GITHUB_RUN_NUMBER/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"1.0.$GITHUB_RUN_NUMBER\"/" export_presets.cfg

      - name: Validate GDScript project
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_LOG="$RUNNER_TEMP/godot-validation.log"
          ./Godot_v4.3-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --editor --quit 2>&1 | tee "$VALIDATION_LOG"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$VALIDATION_LOG"; then
            echo "Godot reported a GDScript parse/load error."
            exit 1
          fi

      - name: Export signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$GITHUB_WORKSPACE/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="${{ secrets.ANDROID_KEY_ALIAS }}"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

          mkdir -p build/android
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path "$GITHUB_WORKSPACE" \
            --export-release "Android" build/android/ContainmentProtocol.apk \
            2>&1 | tee build/android/export.log

          test -s build/android/ContainmentProtocol.apk
          ls -lh build/android/ContainmentProtocol.apk
          tail -n 100 build/android/export.log

      - name: Verify APK v1/v2/v3 signatures and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="build/android/ContainmentProtocol.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee build/android/signature-verification.log
          grep -F "Verified using v1 scheme (JAR signing): true" build/android/signature-verification.log
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" build/android/signature-verification.log
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" build/android/signature-verification.log
          sha256sum "$APK" | tee build/android/ContainmentProtocol.apk.sha256
          APK_BYTES="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "## Android APK"
            echo "- File: ContainmentProtocol.apk"
            echo "- Size: $APK_BYTES bytes"
            echo "- SHA-256: $APK_SHA256"
            echo "- Signing: v1, v2, and v3 verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish raw APK to rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="build/android/ContainmentProtocol.apk"
          RELEASE_APK="ContainmentProtocol.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          test -s "$RELEASE_APK"
          file "$RELEASE_APK" | tee build/android/release-apk-file-type.txt
          file "$RELEASE_APK" | grep -E 'Android package|Zip archive data|Java archive data' >/dev/null || true
          APK_BYTES="$(stat -c '%s' "$RELEASE_APK")"
          APK_SHA256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          TAG="latest-android-apk"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$RELEASE_APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest Android Build" \
              --notes "Commit $GITHUB_SHA"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Latest Android Build" \
              --notes "Commit $GITHUB_SHA"
            gh release upload "$TAG" "$RELEASE_APK" \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
          {
            echo "## Direct Android APK Release"
            echo "- URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$RELEASE_APK"
            echo "- Size: $APK_BYTES bytes"
            echo "- SHA-256: $APK_SHA256"
            echo "- Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RELEASE_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContainmentProtocol-APK
          path: |
            build/android/ContainmentProtocol.apk
            build/android/ContainmentProtocol.apk.sha256
          if-no-files-found: error
